name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      # `--ignore-scripts`, because this job holds `id-token: write` for npm
      # Trusted Publishing. Without it every dependency's install hook runs
      # while the OIDC credential that can publish this package is available.
      # Nothing in the tree has an install/preinstall/postinstall hook — checked
      # with `npm query ':attr(scripts,[postinstall])'` and its siblings — so
      # this costs nothing and closes the window.
      - run: npm ci --ignore-scripts
      - run: npm publish --provenance

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The registry verifies the OCI package by pulling it, so the tag has to
      # exist first. It is pushed by ci.yml's publish job, which runs on the
      # same tag in parallel with this workflow.
      - name: Wait for the GHCR image tag
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 60); do
            token="$(curl -s "https://ghcr.io/token?scope=repository:ni-c/wg-easy-mcp:pull&service=ghcr.io" | jq -r .token)"
            if curl -sf -o /dev/null -H "Authorization: Bearer $token" \
                 -H 'Accept: application/vnd.oci.image.index.v1+json' \
                 "https://ghcr.io/v2/ni-c/wg-easy-mcp/manifests/$version"; then
              echo "ghcr.io/ni-c/wg-easy-mcp:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/wg-easy-mcp:$version ($i/60)"
            sleep 30
          done
          echo "Timed out. If the CI publish job succeeded, check that the GHCR" >&2
          echo "package visibility is public — it does not inherit from the repo." >&2
          echo "Fix it, then re-run mcp-registry.yml via workflow_dispatch." >&2
          exit 1
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The npm package carries a version field; the OCI package must not —
          # its version lives in the identifier tag. Do not simplify this back
          # to .packages[0].version.
          jq --arg v "$version" '
            .version = $v
            | .packages |= map(
                if .registryType == "oci"
                then .identifier = "ghcr.io/ni-c/wg-easy-mcp:" + $v
                else .version = $v
                end
              )' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        # Pinned to a release and checked against its published checksum: this
        # job holds an OIDC token for the MCP registry, so what it runs must be
        # what was reviewed. `releases/latest/download` piped straight into tar
        # runs whatever the upstream serves on the day — every GitHub Action
        # around it is SHA-pinned for exactly this reason.
        run: |
          version=v1.8.1
          sha256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$version/mcp-publisher_linux_amd64.tar.gz"
          echo "$sha256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No changelog section found for version $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # `--verify-tag`: the release is created from whatever `GITHUB_REF_NAME`
        # says, and without this a tag that no longer exists (deleted and
        # re-pushed against another commit) still gets a release.
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
